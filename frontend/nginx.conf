server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 压缩交给 Caddy，避免两层重复处理
    gzip off;

    # 带指纹的构建产物可长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 入口页不缓存，发版后立即拿到新的资源引用
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA：其余路径交给前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }
}
