server:
  port: ${GALLEY_SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: jameshome-galley
  datasource:
    url: ${GALLEY_DB_URL:jdbc:postgresql://localhost:5432/galley}
    username: ${GALLEY_DB_USERNAME:galley}
    password: ${GALLEY_DB_PASSWORD:galley}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

galley:
  version: 0.0.1
  env: ${GALLEY_ENV:dev}

logging:
  level:
    root: ${GALLEY_LOG_LEVEL:info}
    io.github.jameshome.galley: ${GALLEY_LOG_LEVEL:info}
