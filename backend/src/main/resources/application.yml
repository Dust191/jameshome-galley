server:
  port: ${GALLEY_SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: jameshome-galley
  jackson:
    mapper:
      # 对外枚举取值一律小写（admin / active / inactive），与 DES-002 的示例一致。
      # Jackson 默认按常量名精确匹配，会把 "inactive" 判为非法值并抛 500。
      accept-case-insensitive-enums: true
  datasource:
    url: ${GALLEY_DB_URL:jdbc:postgresql://localhost:5432/galley}
    username: ${GALLEY_DB_USERNAME:galley}
    password: ${GALLEY_DB_PASSWORD:galley}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  session:
    store-type: jdbc
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

springdoc:
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

galley:
  # 由 Maven 资源过滤注入，保证契约版本与 pom 一致
  version: @project.version@
  env: ${GALLEY_ENV:dev}
  bootstrap:
    admin-username: ${GALLEY_BOOTSTRAP_ADMIN_USERNAME:admin}
  register:
    # 注册端点按 IP 的固定窗口限流（DVT-09 / 决策 D-20）：窗口内成败都计数，超限返回 429 + Retry-After
    rate-limit:
      max-attempts: 10
      window-seconds: 600
  reconcile:
    # 每日对账的 cron，默认 02:30；测试环境可设为 "-" 或关闭 scheduled 开关
    cron: ${GALLEY_RECONCILE_CRON:0 30 2 * * *}
  storage:
    endpoint: ${GALLEY_S3_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${GALLEY_S3_ACCESS_KEY:galley}
    secret-key: ${GALLEY_S3_SECRET_KEY:galley123}
    bucket: ${GALLEY_S3_BUCKET:galley-material}
    public-base: ${GALLEY_S3_PUBLIC_BASE:http://127.0.0.1:9000/galley-material}
    max-image-bytes: ${GALLEY_S3_MAX_IMAGE_BYTES:5242880}

logging:
  level:
    root: ${GALLEY_LOG_LEVEL:info}
    io.github.jameshome.galley: ${GALLEY_LOG_LEVEL:info}
