# 生产编排骨架。S5 阶段定稿，当前仅锁定三服务结构与健康检查方式，不含最终资源配置。
# 约定：staging 与 prod 同镜像、同编排、不同配置；镜像使用固定 tag，禁止 latest。
services:
  api:
    image: ${GALLEY_IMAGE_API:ghcr.io/jameshome/galley-api:0.0.1}
    environment:
      GALLEY_ENV: prod
      GALLEY_SERVER_PORT: "8080"
      GALLEY_DB_URL: ${GALLEY_DB_URL}
      GALLEY_DB_USERNAME: ${GALLEY_DB_USERNAME}
      GALLEY_DB_PASSWORD: ${GALLEY_DB_PASSWORD}
      GALLEY_LOG_LEVEL: info
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  web:
    image: ${GALLEY_IMAGE_WEB:ghcr.io/jameshome/galley-web:0.0.1}
    expose:
      - "80"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
