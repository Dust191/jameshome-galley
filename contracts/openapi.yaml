components:
  schemas:
    ResetPasswordResponse:
      type: object
      properties:
        temporaryPassword:
          type: string
    UnitCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 20
          minLength: 0
        sortOrder:
          type: integer
          format: int32
          maximum: 32767
          minimum: -32768
      required:
      - name
    UnitView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        status:
          type: string
    MovementCreate:
      type: object
      properties:
        materialId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - IN
          - OUT
          - ADJUST
          - REVERSAL
        quantity:
          type: number
        occurredAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 200
          minLength: 0
        idempotencyKey:
          type: string
          maxLength: 64
          minLength: 0
      required:
      - materialId
      - occurredAt
      - quantity
      - type
    MovementView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        materialId:
          type: string
          format: uuid
        materialName:
          type: string
        unitName:
          type: string
        type:
          type: string
        quantity:
          type: number
        occurredAt:
          type: string
          format: date-time
        operatorName:
          type: string
        note:
          type: string
        reversed:
          type: boolean
        reversalOf:
          type: string
          format: uuid
    ReversalRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - note
    MaterialCreate:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          minLength: 0
        name:
          type: string
          maxLength: 80
          minLength: 0
        categoryId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        spec:
          type: string
          maxLength: 50
          minLength: 0
        safetyStock:
          type: number
          minimum: 0
        shelfLifeDays:
          type: integer
          format: int32
          minimum: 1
        imageKey:
          type: string
          maxLength: 255
          minLength: 0
        note:
          type: string
          maxLength: 200
          minLength: 0
      required:
      - categoryId
      - name
      - safetyStock
      - unitId
    MaterialView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        unitId:
          type: string
          format: uuid
        unitName:
          type: string
        spec:
          type: string
        safetyStock:
          type: number
        shelfLifeDays:
          type: integer
          format: int32
        imageKey:
          type: string
        imageUrl:
          type: string
        note:
          type: string
        status:
          type: string
        version:
          type: integer
          format: int32
        currentStock:
          type: number
    InviteView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        status:
          type: string
        usedBy:
          type: string
          format: uuid
        usedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ImportResult:
      type: object
      properties:
        total:
          type: integer
          format: int32
        created:
          type: integer
          format: int32
        errors:
          type: array
          items:
            $ref: "#/components/schemas/RowError"
    RowError:
      type: object
      properties:
        line:
          type: integer
          format: int32
        field:
          type: string
        message:
          type: string
        raw:
          type: string
    UploadResponse:
      type: object
      properties:
        key:
          type: string
        url:
          type: string
    CategoryCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 50
          minLength: 0
        sortOrder:
          type: integer
          format: int32
          maximum: 32767
          minimum: -32768
      required:
      - name
    CategoryView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: integer
          format: int32
        status:
          type: string
    RegisterRequest:
      type: object
      properties:
        inviteCode:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
          pattern: "^[a-z0-9_]{3,32}$"
        password:
          type: string
          maxLength: 64
          minLength: 8
        displayName:
          type: string
          maxLength: 50
          minLength: 0
      required:
      - inviteCode
      - password
      - username
    MeResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
        status:
          type: string
        mustChangePassword:
          type: boolean
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - password
      - username
    UpdateUserRequest:
      type: object
      properties:
        displayName:
          type: string
        role:
          type: string
          enum:
          - ADMIN
          - EDITOR
          - VIEWER
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
    UserView:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        displayName:
          type: string
        role:
          type: string
        status:
          type: string
        passwordUpdatedAt:
          type: string
          format: date-time
    UnitPatch:
      type: object
      properties:
        name:
          type: string
        sortOrder:
          type: integer
          format: int32
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    MaterialPatch:
      type: object
      properties:
        code:
          type: string
          maxLength: 32
          minLength: 0
        name:
          type: string
