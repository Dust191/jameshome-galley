openapi: 3.0.3
info:
  title: jameshome-galley API
  version: 0.0.1
  description: |
    团体厨房库存远程查看系统的接口契约。
    本文件由后端 springdoc 生成后固化提交，CI 校验实现与文件的差异；手工改动须与实现同步。
servers:
  - url: /
paths:
  /healthz:
    get:
      operationId: healthz
      summary: 存活探针
      description: 不查库，仅返回进程状态与版本号。就绪探针走 /actuator/health/readiness。
      responses:
        "200":
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status:
                    type: string
                    example: ok
                  version:
                    type: string
                    example: 0.0.1
