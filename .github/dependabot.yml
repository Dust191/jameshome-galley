version: 2

updates:
  # 后端：Maven 依赖集中由父 POM 管理，Dependabot 只在父 POM 改版本
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
      mybatis:
        patterns: ["com.baomidou*"]
      test:
        patterns: ["org.junit*", "org.assertj*", "com.tngtech.archunit*"]
    ignore:
      # 构建工具自身的大版本：单独开轮次验证，不当周更处理
      - dependency-name: "org.apache.maven:apache-maven"
        versions: [">=3.10"]

  # 前端
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react*", "@types/react*"]
      tooling:
        patterns: ["vite", "typescript", "eslint*", "prettier"]
    ignore:
      # 以下为 UI 框架与路由的大版本：涉及 antd 5 兼容性，升级属 0.2.0 级工程
      # （ITER-20261103-05；解除限制需 Maintainer 批准并更新此处）
      - dependency-name: "antd"
        versions: [">=6"]
      - dependency-name: "react"
        versions: [">=19"]
      - dependency-name: "react-dom"
        versions: [">=19"]
      - dependency-name: "@types/react"
        versions: [">=19"]
      - dependency-name: "@types/react-dom"
        versions: [">=19"]
      - dependency-name: "react-router-dom"
        versions: [">=7"]
      - dependency-name: "@vitejs/plugin-react"
        versions: [">=5"]
      - dependency-name: "@tanstack/react-query"
        versions: [">=5.63"]

  # 流水线自身
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      # actions 的大版本同步留给专门的轮次，避免与业务变更混在一起
      - dependency-name: "actions/checkout"
        versions: [">=5"]
      - dependency-name: "actions/setup-java"
        versions: [">=5"]
      - dependency-name: "actions/setup-node"
        versions: [">=5"]
