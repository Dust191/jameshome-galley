name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 lint + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Spotless + 测试 + 打包
        working-directory: backend
        run: ./mvnw -B verify

  frontend:
    name: 前端 lint + 类型 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: 格式与静态检查
        working-directory: frontend
        run: |
          pnpm exec prettier --check .
          pnpm exec eslint .
      - name: 类型检查与构建
        working-directory: frontend
        run: pnpm build

  guards:
    # 注意：本 job 的 name 是分支保护的必需检查上下文，改名会导致 PR 被必需检查卡住。
    name: 契约 + 环境变量 + 署名
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 契约校验
        run: bash scripts/check-contract.sh
      - name: 环境变量一致性
        run: bash scripts/check-env-example.sh
      # 生产编排从来没有被解析过，变量插值写错只能等真机启动才暴露；用模板跑一次 config 挡在合并前
      - name: 生产编排校验
        run: docker compose --env-file infra/compose/.env.prod.example -f infra/compose/compose.prod.yml config -q
      # 覆盖层与基础编排合并后才算完整配置，单独解析基础文件发现不了端口与档位冲突
      - name: staging 编排校验
        run: docker compose -p galley-staging --env-file infra/compose/.env.staging.example -f infra/compose/compose.prod.yml -f infra/compose/compose.staging.yml config -q
      - name: 提交信息校验
        run: bash scripts/check-commit-message.sh "${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD"
      - name: 提交署名校验
        run: bash scripts/check-signoff.sh "${{ github.event.pull_request.base.sha || 'HEAD~1' }}..HEAD"
      - name: 文档结构校验
        run: node scripts/check-docs.mjs
