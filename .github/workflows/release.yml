# 发布流水线：打 tag 即构建两个镜像并推到 GHCR，随后把同一份镜像复制进 ACR。
# ECS 一律从 ACR 内网域名拉取（`deploy.md` §2.3），不走公网拉 GHCR。
# 手动触发用于补同步：只复制已存在的 tag，不重新构建。
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的发布 tag（如 v0.2.2），仅同步到 ACR，不重新构建
        required: true

permissions:
  contents: read
  packages: write

env:
  ACR_REGISTRY: crpi-8wtwv1zju2g9kpgg.cn-hangzhou.personal.cr.aliyuncs.com
  ACR_NAMESPACE: jameshome-galley

jobs:
  images:
    name: 构建并推送 ${{ matrix.name }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
            image: galley-api
          - name: web
            context: frontend
            image: galley-web
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          # 生产只用固定 tag，禁止 latest 漂移
          flavor: |
            latest=false
          # semver 会把 v0.1.0 归一成 0.1.0，与编排里的固定 tag 对齐
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # 不生成 provenance / SBOM：它们会额外挂一个 config 为 oci.empty 的工件，
          # ACR 个人版拒收这种索引，同步会 403。镜像本身的可追溯性由 tag 与提交保证。
          provenance: false
          sbom: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  acr-sync:
    name: 同步 ${{ matrix.name }} 到 ACR
    # 打 tag 时跟随构建结果；手动触发时跳过构建，只补同步
    if: always() && (github.event_name == 'workflow_dispatch' || needs.images.result == 'success')
    needs: images
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            source: galley-api
            target: api
          - name: web
            source: galley-web
            target: web
    steps:
      - name: 解析版本号
        id: ver
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: 复制镜像
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          # 仓库所有者是 Dust191，而镜像名只接受小写
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          SRC="ghcr.io/${OWNER}/${{ matrix.source }}:${VERSION}"
          DST="${ACR_REGISTRY}/${ACR_NAMESPACE}/${{ matrix.target }}:${VERSION}"

          # ACR 个人版不接受带 attestation 的 OCI 索引：索引里那个 config 为
          # application/vnd.oci.empty.v1+json 的工件会被判为未知 manifest class，
          # 直接 push 整个索引会 403。故先取出 amd64 单平台清单的 digest，只拉它。
          DIGEST=$(docker buildx imagetools inspect --raw "$SRC" \
            | jq -r '[.manifests[]? | select(.platform.os=="linux" and .platform.architecture=="amd64")][0].digest // empty')
          if [ -z "$DIGEST" ]; then
            echo "未能从 $SRC 的索引中取到 amd64 清单，发布镜像结构可能已变" >&2
            exit 1
          fi

          docker pull "ghcr.io/${OWNER}/${{ matrix.source }}@${DIGEST}"
          docker tag "ghcr.io/${OWNER}/${{ matrix.source }}@${DIGEST}" "$DST"
          docker push "$DST"
          docker image inspect --format '{{index .RepoDigests 0}}' "$DST"
