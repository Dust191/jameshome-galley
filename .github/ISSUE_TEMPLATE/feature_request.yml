name: 功能建议
description: 提出新能力之前，先对照范围冻结表（docs/01-product/scope.md）
labels: ["type/feature", "status/needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        本项目的范围受 `SCOPE-001` 冻结表约束：In 列不再增加，新需求进「参考方向」或下个 minor。
        提议前请先自查下面第三节的三个框。
  - type: textarea
    id: problem
    attributes:
      label: 问题场景
      description: 真实使用中遇到了什么、现在是怎么绕过去的
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望能力
      description: 期望的行为；能给出可判断的验收口径最好
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 不加这个功能，还有哪些办法达成目的
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 范围自查（对照 SCOPE-001）
      options:
        - label: 不属于 Out 列明确不做的事项
          required: true
        - label: 不违反三条硬边界（非商业 / 不改写现场作业 / 不做组织集成）
          required: true
        - label: 若属「参考方向」，接受该提议在上线（G5）之前不做
          required: true
